<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warden status map</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --sunk: #f1f3f6; --ink: #1c2330; --muted: #5d6878; --line: #d5dae2;
  --red: #d64545; --red-bg: #fdecec; --amber: #c98a12; --amber-bg: #fdf4e1;
  --green: #2f9e62; --green-bg: #e8f6ee; --grey: #8a93a3; --grey-bg: #eef0f3;
  --unknown: #7a5cc9; --unknown-bg: #f0ebfb; --focus: #2d6cdf;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b2029; --sunk: #161a22; --ink: #e6e9ef; --muted: #98a2b3; --line: #343c4a;
    --red: #f06a6a; --red-bg: #3a1f22; --amber: #e3a93a; --amber-bg: #3a2f1a;
    --green: #4cc184; --green-bg: #1a3227; --grey: #8a93a3; --grey-bg: #252a33;
    --unknown: #a68cf0; --unknown-bg: #2a2340; --focus: #6d9cf5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 18px; margin: 0; }
.meta { color: var(--muted); font-size: 12px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel); color: var(--muted); border: 0; padding: 5px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--focus); color: #fff; }
.pill { border-radius: 999px; padding: 2px 10px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.grey { background: var(--grey-bg); color: var(--grey); }
.pill.unknown { background: var(--unknown-bg); color: var(--unknown); }
label.toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
main { padding: 16px; max-width: 1500px; margin: 0 auto; position: relative; }
.causes { background: var(--red-bg); border: 1px solid var(--red); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.causes b { color: var(--red); }
.causes ul { margin: 6px 0 0; padding-left: 20px; }
.ok { background: var(--green-bg); border: 1px solid var(--green); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.errors { color: var(--unknown); font-size: 12px; margin-bottom: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- graph view: nested subgraphs ---------- */
#graph { position: relative; }
svg#arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 3; }
svg#arrows path { fill: none; stroke-width: 1.6; opacity: .55; }
svg#arrows path.red { stroke: var(--red); opacity: .9; stroke-width: 2.2; }
svg#arrows path.green { stroke: var(--green); }
svg#arrows path.amber, svg#arrows path.unknown, svg#arrows path.grey { stroke: var(--amber); }
svg#arrows path.faint { opacity: .08; }
svg#arrows path.hot { opacity: 1; stroke-width: 2.6; }
.sg { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; background: var(--panel); position: relative; }
.sg > .sg-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.sg > .sg-h .t { font-weight: 700; }
.sg > .sg-h .s { color: var(--muted); font-size: 12px; }
.sg.red { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
.sg.amber { border-color: var(--amber); box-shadow: inset 4px 0 0 var(--amber); }
.sg.green { box-shadow: inset 4px 0 0 var(--green); }
.sg.unknown { border-color: var(--unknown); box-shadow: inset 4px 0 0 var(--unknown); }
.sg.grey { box-shadow: inset 4px 0 0 var(--grey); }
.sg.host { background: var(--sunk); border-style: dashed; }
.sg.node { flex: 1 1 420px; min-width: 0; }
.sg.group { background: var(--sunk); border-style: dashed; padding: 8px; }
.sg.group > .sg-h { margin-bottom: 6px; }
.sg.group > .sg-h .t { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.nodes { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.boxes { display: flex; flex-wrap: wrap; gap: 8px; }
.ns { border: 1.5px solid var(--line); border-radius: 9px; background: var(--panel); padding: 6px 9px 8px;
  min-width: 120px; max-width: 240px; cursor: pointer; position: relative; z-index: 2; }
.ns:hover, .ns:focus, .door:hover, .door:focus, .sg-click:hover, .sg-click:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.ns.red { border-color: var(--red); background: var(--red-bg); }
.ns.amber { border-color: var(--amber); background: var(--amber-bg); }
.ns.unknown { border-color: var(--unknown); background: var(--unknown-bg); }
.ns.grey { opacity: .75; }
.ns .n { font-weight: 600; font-size: 13px; word-break: break-word; }
.ns .why { font-size: 11px; color: var(--red); margin-top: 2px; }
.ns.amber .why { color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.chip { font-size: 10.5px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); background: var(--sunk); }
.chip.bad { border-color: var(--amber); color: var(--amber); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grey); }
.dot.green { background: var(--green); } .dot.amber { background: var(--amber); }
.dot.red { background: var(--red); } .dot.unknown { background: var(--unknown); }
.doors { margin-bottom: 26px; }
.door { display: inline-flex; flex-direction: column; border: 1.5px solid var(--line); border-radius: 18px; padding: 3px 12px;
  background: var(--panel); cursor: pointer; font-size: 12px; position: relative; z-index: 2; }
.door.red { border-color: var(--red); background: var(--red-bg); }
.door .x { color: var(--muted); font-size: 10.5px; }
.dim .ns:not(.lit), .dim .door:not(.lit) { opacity: .25; }
.sel { outline: 2px solid var(--focus) !important; outline-offset: 1px; }
.empty { color: var(--muted); font-size: 12px; }
/* phones: nothing may be wider than the screen */
.door, .ns, .card { max-width: 100%; }
.door span, .ns .n, .ns .why, .sg-h .s, .sg-h .t, .causes li, .legend span { overflow-wrap: anywhere; min-width: 0; }
@media (max-width: 600px) {
  main { padding: 12px; }
  .sg { padding: 8px; }
  .sg.node { flex-basis: 100%; }
  .ns { min-width: 0; flex: 1 1 140px; }
}
.ns .also { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* ---------- list view ---------- */
.tier { margin-bottom: 18px; }
.tier h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--grey);
  border-radius: 8px; padding: 8px 10px; min-width: 150px; max-width: 260px; cursor: pointer; }
.card:hover, .card:focus { box-shadow: 0 0 0 2px var(--focus); outline: none; }
.card.red { border-left-color: var(--red); } .card.amber { border-left-color: var(--amber); }
.card.green { border-left-color: var(--green); } .card.unknown { border-left-color: var(--unknown); }
.card .name { font-weight: 600; word-break: break-word; }
.card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card .why { font-size: 12px; margin-top: 4px; }
.card.red .why { color: var(--red); } .card.amber .why { color: var(--amber); }

aside { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
  max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: none; z-index: 10; }
aside.open { display: block; }
aside h3 { margin: 0 0 4px; font-size: 16px; padding-right: 20px; word-break: break-word; }
aside .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
aside ul { padding-left: 18px; margin: 4px 0 10px; }
aside .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }
code { font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Platform status</h1>
    <div class="meta" id="meta">loading…</div>
  </div>
  <div class="counts" id="counts"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="view">
      <button type="button" data-view="graph" aria-pressed="true">Graph</button>
      <button type="button" data-view="list" aria-pressed="false">List</button>
    </div>
    <label class="toggle"><input type="checkbox" id="onlyBad"> only problems</label>
    <label class="toggle"><input type="checkbox" id="allLinks"> show all links</label>
  </div>
</header>
<main id="main">
  <div id="banner"></div>
  <div id="errors" class="errors"></div>
  <div id="view"></div>
</main>
<aside id="detail" aria-live="polite"><button class="close" aria-label="close">×</button><div id="detailBody"></div></aside>
<script>
(function () {
  "use strict";
  var data = null, selected = null, view = "graph";
  var order = ["red", "amber", "unknown", "green", "grey"];
  var label = { red: "down", amber: "degraded", unknown: "unknown", green: "ok", grey: "off" };
  var onlyBad = document.getElementById("onlyBad"), allLinks = document.getElementById("allLinks");
  try {
    onlyBad.checked = localStorage.getItem("warden.onlyBad") === "1";
    allLinks.checked = localStorage.getItem("warden.allLinks") === "1";
    view = localStorage.getItem("warden.view") || "graph";
  } catch (e) {}

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function bad(s) { return s === "red" || s === "amber" || s === "unknown"; }
  function byStatus(a, b) { return order.indexOf(a.status) - order.indexOf(b.status) || a.name.localeCompare(b.name); }

  function find(id) {
    for (var i = 0; i < data.tiers.length; i++)
      for (var j = 0; j < data.tiers[i].components.length; j++)
        if (data.tiers[i].components[j].id === id) return data.tiers[i].components[j];
    return null;
  }
  function tierOf(id) {
    for (var i = 0; i < data.tiers.length; i++)
      for (var j = 0; j < data.tiers[i].components.length; j++)
        if (data.tiers[i].components[j].id === id) return data.tiers[i].name;
    return "";
  }

  // everything the selection depends on, and everything that depends on it
  function neighbours(id) {
    var up = {}, down = {}, changed = true;
    up[id] = down[id] = true;
    while (changed) {
      changed = false;
      data.edges.forEach(function (e) {
        if (up[e.from] && !up[e.to]) { up[e.to] = true; changed = true; }
        if (down[e.to] && !down[e.from]) { down[e.from] = true; changed = true; }
      });
    }
    var set = {};
    Object.keys(up).concat(Object.keys(down)).forEach(function (k) { set[k] = true; });
    return set;
  }

  function clickable(node, id) {
    node.tabIndex = 0;
    node.setAttribute("role", "button");
    node.dataset.id = id;
    node.addEventListener("click", function (e) { e.stopPropagation(); select(id); });
    node.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); select(id); }
    });
  }

  function header() {
    var t = new Date(data.generated);
    document.getElementById("meta").textContent = "updated " + t.toLocaleTimeString() + " · refreshes every 30s";
    var counts = document.getElementById("counts"); counts.textContent = "";
    order.forEach(function (s) {
      if (data.summary[s]) counts.appendChild(el("span", "pill " + s, data.summary[s] + " " + label[s]));
    });
    var banner = document.getElementById("banner"); banner.textContent = "";
    if (data.causes && data.causes.length) {
      var box = el("div", "causes");
      box.appendChild(el("b", null, "Likely causes"));
      var ul = el("ul");
      data.causes.forEach(function (c) { ul.appendChild(el("li", null, c)); });
      box.appendChild(ul); banner.appendChild(box);
    } else if (!data.summary.red) {
      banner.appendChild(el("div", "ok", "Nothing is down."));
    }
    document.getElementById("errors").textContent =
      (data.errors && data.errors.length) ? "Could not read: " + data.errors.join("; ") : "";
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.view === view ? "true" : "false");
    });
  }

  // ---------------- graph view ----------------
  function subgraph(cls, title, status, sub, id) {
    var g = el("div", "sg " + cls + (status ? " " + status : ""));
    var h = el("div", "sg-h");
    var t = el("span", "t", title);
    if (id) { t.className += " sg-click"; clickable(t, id); }
    h.appendChild(t);
    if (status) h.appendChild(el("span", "pill " + status, label[status]));
    if (sub) h.appendChild(el("span", "s", sub));
    g.appendChild(h);
    return g;
  }

  // A namespace box inside a node is coloured by ITS pods on that node plus
  // the namespace's own app/front-door problems — not by its pods elsewhere,
  // so kube-system on a healthy node stays green while its twin is red.
  function rankOf(s) { return { red: 4, amber: 3, unknown: 2, green: 1 }[s] || 0; }
  function instance(c, pods, node) {
    if (node === undefined) return { status: c.status, why: (c.reasons || [])[0] };
    var st = pods.length ? "green" : c.status, why = "", badPods = {}, nBad = 0;
    pods.forEach(function (p) {
      if (rankOf(p.status) > rankOf(st)) st = p.status;
      if (p.status !== "green") { nBad++; badPods[p.reason || p.status] = (badPods[p.reason || p.status] || 0) + 1; }
    });
    if (nBad) {
      var top = Object.keys(badPods).sort(function (x, y) { return badPods[y] - badPods[x]; })[0];
      why = (nBad === 1 ? "1 pod" : nBad + " pods") + ": " + top;
    }
    (c.reasons || []).forEach(function (r) {
      if (r.indexOf("app ") === 0 || r.indexOf("front door ") === 0) {
        var s2 = /Degraded|Missing|failing/.test(r) ? "red" : "amber";
        if (rankOf(s2) > rankOf(st)) st = s2;
        if (!why) why = r;
      }
    });
    return { status: st, why: why };
  }

  function nsBox(c, pods, lit, node) {
    var inst = instance(c, pods, node);
    var b = el("div", "ns " + inst.status);
    clickable(b, c.id);
    if (lit && lit[c.id]) b.className += " lit";
    if (c.id === selected) b.className += " sel";
    b.appendChild(el("div", "n", c.name));
    var ready = pods.filter(function (p) { return p.status === "green"; }).length;
    if (inst.why && bad(inst.status)) b.appendChild(el("div", "why", inst.why));
    if (node !== undefined && c.nodes && c.nodes.length > 1) {
      var others = c.nodes.filter(function (n) { return n !== node; });
      b.appendChild(el("div", "also", "also on " + others.join(", ")));
    }
    if (c.apps && c.apps.length) {
      var chips = el("div", "chips");
      c.apps.forEach(function (a) {
        var ok = a.sync === "Synced" && (a.health === "Healthy" || a.health === "Suspended");
        var ch = el("span", "chip" + (ok ? "" : " bad"), a.name);
        ch.title = "ArgoCD " + a.name + ": " + a.sync + " / " + a.health;
        chips.appendChild(ch);
      });
      b.appendChild(chips);
    }
    if (pods.length) {
      var dots = el("div", "dots");
      pods.forEach(function (p) {
        var d = el("span", "dot " + p.status);
        d.title = p.name + (p.reason ? " — " + p.reason : "");
        dots.appendChild(d);
      });
      dots.title = ready + "/" + pods.length + " pods healthy here";
      b.appendChild(dots);
    }
    return b;
  }

  function graph(root) {
    var lit = selected ? neighbours(selected) : null;
    var only = onlyBad.checked;
    var g = el("div"); g.id = "graph";
    if (lit) g.className = "dim";
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "arrows";
    g.appendChild(svg);

    var legend = el("div", "legend");
    [["green", "healthy pod"], ["amber", "starting / not ready"], ["red", "failing"]].forEach(function (x) {
      var s = el("span"); s.appendChild(el("span", "dot " + x[0])); s.appendChild(document.createTextNode(x[1])); legend.appendChild(s);
    });
    var s2 = el("span"); s2.appendChild(el("span", "chip", "app")); s2.appendChild(document.createTextNode("ArgoCD application")); legend.appendChild(s2);
    var s3 = el("span", null, "Arrows (front door → namespace) show for failing doors and the selection; tick \"show all links\" for every one"); legend.appendChild(s3);
    g.appendChild(legend);

    var tier = function (n) { for (var i = 0; i < data.tiers.length; i++) if (data.tiers[i].name === n) return data.tiers[i].components; return []; };
    var host = tier("Host")[0], nodes = tier("Nodes").slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var nsAll = tier("Platform").concat(tier("Observability"), tier("Apps"));
    var doors = tier("Front doors").slice().sort(byStatus);
    if (only) doors = doors.filter(function (d) { return bad(d.status) || d.id === selected; });

    // front doors: the subgraph above the host, arrows go down into namespaces
    var dg = subgraph("doors", "Front doors", null, doors.length + " probed");
    var drow = el("div", "boxes");
    doors.forEach(function (d) {
      var b = el("div", "door " + d.status);
      clickable(b, d.id);
      if (lit && lit[d.id]) b.className += " lit";
      if (d.id === selected) b.className += " sel";
      b.appendChild(el("span", null, d.name));
      if (d.notes && d.notes.length) b.appendChild(el("span", "x", d.notes[0]));
      drow.appendChild(b);
    });
    if (!doors.length) drow.appendChild(el("div", "empty", only ? "all front doors answer" : "no probes"));
    dg.appendChild(drow);
    g.appendChild(dg);

    // host ⊃ nodes ⊃ tier groups ⊃ namespaces ⊃ pods
    var hg = subgraph("host", host ? host.name : "Host", host && host.status, host && host.notes && host.notes[0], host && host.id);
    var nrow = el("div", "nodes");
    var tiers = ["Platform", "Observability", "Apps"];
    nodes.forEach(function (n) {
      var ng = subgraph("node", n.name, n.status, (n.reasons && n.reasons[0]) || (n.notes && n.notes[0]) || "VM node", n.id);
      var stack = el("div", "stack"), any = false;
      tiers.forEach(function (tn) {
        var here = tier(tn).map(function (c) {
          return { c: c, pods: (c.podList || []).filter(function (p) { return p.node === n.name; }) };
        }).filter(function (x) { return x.pods.length && (!only || bad(instance(x.c, x.pods, n.name).status) || x.c.id === selected); });
        if (!here.length) return;
        any = true;
        here.sort(function (a, b) { return byStatus(a.c, b.c); });
        var grp = subgraph("group", tn, null, here.length + " namespaces");
        var boxes = el("div", "boxes");
        here.forEach(function (x) { boxes.appendChild(nsBox(x.c, x.pods, lit, n.name)); });
        grp.appendChild(boxes); stack.appendChild(grp);
      });
      if (!any) stack.appendChild(el("div", "empty", only ? "nothing wrong here" : "no pods"));
      ng.appendChild(stack); nrow.appendChild(ng);
    });
    hg.appendChild(nrow);

    // pods with no node (Pending, unschedulable) and namespaces with no pods at all
    var unplaced = nsAll.map(function (c) {
      return { c: c, pods: (c.podList || []).filter(function (p) { return !p.node; }) };
    }).filter(function (x) { return x.pods.length; });
    if (unplaced.length) {
      var ug = subgraph("group red", "Not placed on any node", null, "pods waiting for a node");
      var ub = el("div", "boxes");
      unplaced.forEach(function (x) { ub.appendChild(nsBox(x.c, x.pods, lit, "")); });
      ug.appendChild(ub); ug.style.marginTop = "12px"; hg.appendChild(ug);
    }
    var idle = nsAll.filter(function (c) { return !(c.podList || []).length && (!only || bad(c.status)); });
    if (idle.length) {
      var ig = subgraph("group", "No running pods", null, "suspended or scaled to zero");
      var ib = el("div", "boxes");
      idle.forEach(function (c) { ib.appendChild(nsBox(c, [], lit)); });
      ig.appendChild(ib); ig.style.marginTop = "12px"; hg.appendChild(ig);
    }
    g.appendChild(hg);
    root.appendChild(g);
    requestAnimationFrame(arrows);
  }

  function arrows() {
    var g = document.getElementById("graph"), svg = document.getElementById("arrows");
    if (!g || !svg) return;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var gr = g.getBoundingClientRect();
    svg.setAttribute("width", gr.width); svg.setAttribute("height", gr.height);
    var lit = selected ? neighbours(selected) : null;
    data.edges.forEach(function (e) {
      if (e.from.indexOf("door/") !== 0) return;
      var src = g.querySelector('.door[data-id="' + CSS.escape(e.from) + '"]');
      if (!src) return;
      var door = find(e.from);
      g.querySelectorAll('.ns[data-id="' + CSS.escape(e.to) + '"]').forEach(function (dst) {
        var a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
        var x1 = a.left + a.width / 2 - gr.left, y1 = a.bottom - gr.top;
        var x2 = b.left + b.width / 2 - gr.left, y2 = b.top - gr.top;
        var dy = Math.max(30, (y2 - y1) / 2);
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", "M" + x1 + "," + y1 + " C" + x1 + "," + (y1 + dy) + " " + x2 + "," + (y2 - dy) + " " + x2 + "," + y2);
        var st = (door && door.status) || "green", hot = lit && lit[e.from] && lit[e.to];
        if (!allLinks.checked && !hot && !bad(st)) return; // calm by default: only what matters
        var cls = st + (lit ? (hot ? " hot" : " faint") : "");
        p.setAttribute("class", cls);
        svg.appendChild(p);
      });
    });
  }

  // ---------------- list view ----------------
  function sub(c) {
    if (c.kind === "namespace") {
      var bits = [];
      if (c.pods) bits.push(c.pods.ready + "/" + c.pods.total + " pods ready");
      if (c.apps && c.apps.length) bits.push(c.apps.length + (c.apps.length === 1 ? " app" : " apps"));
      return bits.join(" · ") || "no pods";
    }
    return (c.notes && c.notes[0]) || c.kind;
  }
  function list(root) {
    var only = onlyBad.checked;
    data.tiers.forEach(function (tier) {
      var comps = tier.components.filter(function (c) { return !only || bad(c.status) || c.id === selected; }).sort(byStatus);
      if (!comps.length && only) return;
      var sec = el("section", "tier");
      sec.appendChild(el("h2", null, tier.name));
      var row = el("div", "row");
      if (!comps.length) row.appendChild(el("div", "empty", "none"));
      comps.forEach(function (c) {
        var card = el("div", "card " + c.status + (c.id === selected ? " sel" : ""));
        clickable(card, c.id);
        card.appendChild(el("div", "name", c.name));
        card.appendChild(el("div", "sub", sub(c)));
        if (c.reasons && c.reasons.length) card.appendChild(el("div", "why", c.reasons[0]));
        row.appendChild(card);
      });
      sec.appendChild(row); root.appendChild(sec);
    });
  }

  // ---------------- detail panel ----------------
  function bullets(parent, title, items) {
    if (!items || !items.length) return;
    parent.appendChild(el("div", "k", title));
    var ul = el("ul");
    items.forEach(function (i) { ul.appendChild(el("li", null, i)); });
    parent.appendChild(ul);
  }
  function detail() {
    var aside = document.getElementById("detail"), body = document.getElementById("detailBody");
    var c = selected && find(selected);
    if (!c) { aside.className = ""; return; }
    body.textContent = "";
    body.appendChild(el("h3", null, c.name));
    body.appendChild(el("span", "pill " + c.status, label[c.status]));
    var tn = tierOf(c.id);
    if (c.kind === "namespace" && tn) body.appendChild(el("span", "meta", "  " + tn));
    bullets(body, "Why", c.reasons);
    bullets(body, "Notes", c.notes);
    if (c.pods) bullets(body, "Pods", [c.pods.ready + " of " + c.pods.total + " ready"]);
    if (c.podList && c.podList.some(function (p) { return p.status !== "green"; }))
      bullets(body, "Unhealthy pods", c.podList.filter(function (p) { return p.status !== "green"; }).map(function (p) {
        return p.name + " (" + (p.node || "no node") + ")" + (p.reason ? " — " + p.reason : "");
      }));
    bullets(body, "Runs on", c.nodes);
    bullets(body, "ArgoCD apps", (c.apps || []).map(function (a) { return a.name + " — " + a.sync + " / " + a.health; }));
    if (c.target) bullets(body, "Probe target", [c.target]);
    if (c.last) {
      body.appendChild(el("div", "k", "Latest Warden investigation"));
      var p = el("div"); p.appendChild(el("code", null, c.last.id));
      p.appendChild(document.createTextNode(" " + c.last.alert + " · " + new Date(c.last.ts).toLocaleString()));
      body.appendChild(p);
    }
    if (c.kind === "host" && data.recent && data.recent.length) {
      bullets(body, "Recent cluster-wide investigations", data.recent.map(function (r) {
        return r.alert + " · " + new Date(r.ts).toLocaleTimeString() + " (" + r.id + ")";
      }));
    }
    aside.className = "open";
  }

  function render() {
    if (!data) return;
    header();
    var root = document.getElementById("view"); root.textContent = "";
    if (view === "list") list(root); else graph(root);
    detail();
  }

  function select(id) { selected = selected === id ? null : id; render(); }
  document.querySelector("aside .close").addEventListener("click", function () { selected = null; render(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && selected) { selected = null; render(); } });
  allLinks.addEventListener("change", function () {
    try { localStorage.setItem("warden.allLinks", allLinks.checked ? "1" : "0"); } catch (e) {}
    arrows();
  });
  onlyBad.addEventListener("change", function () {
    try { localStorage.setItem("warden.onlyBad", onlyBad.checked ? "1" : "0"); } catch (e) {}
    render();
  });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      view = b.dataset.view;
      try { localStorage.setItem("warden.view", view); } catch (e) {}
      render();
    });
  });
  var rt = null;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(arrows, 100); });

  function load() {
    fetch("map.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) { data = d; render(); }).catch(function (e) {
      document.getElementById("meta").textContent = "could not load the map: " + e.message + " — retrying";
    });
  }
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
